<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Registration | WildWest Ranch</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #f6efe4 0%, #e8dcc4 100%);
            padding: 50px 20px;
        }
        .register-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
        }
        .auth-toggles {
            position: fixed;
            top: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
            z-index: 1000;
        }
        .nav-logo-link {
            text-decoration: none;
            color: inherit;
            transition: opacity 0.3s ease;
        }
        .nav-logo-link:hover {
            opacity: 0.8;
        }
        .password-field {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 0;
            z-index: 10;
        }
        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .apple-btn:hover {
            background: #000;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .google-btn:hover {
            background: #db4437;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(219,68,55,0.3);
        }
        .text-saddle-brown {
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .text-saddle-brown:hover {
            color: var(--burnt-sienna) !important;
            text-decoration: underline;
        }

        /* Dark Mode Overrides */
        [data-theme="dark"] body {
            background: radial-gradient(circle at center, #2f241d 0%, #1a1410 100%);
        }
        [data-theme="dark"] .register-card {
            background: rgba(47, 36, 29, 0.9);
            border-color: rgba(255,255,255,0.1);
            color: #fff;
        }
        [data-theme="dark"] .register-card h2 {
            color: #fff;
        }
        [data-theme="dark"] .form-label {
            color: rgba(255,255,255,0.8);
        }
        [data-theme="dark"] .form-control {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.1);
            color: #fff;
        }
        [data-theme="dark"] .form-control::placeholder {
            color: rgba(255,255,255,0.3);
        }
        [data-theme="dark"] .text-muted, [data-theme="dark"] .small {
            color: rgba(255,255,255,0.6) !important;
        }
        [data-theme="dark"] .social-btn {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.1);
            color: #fff;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .auth-toggles {
                top: 15px;
                right: 15px;
                gap: 10px;
            }
            .auth-toggles .btn {
                padding: 6px !important;
                font-size: 0.8rem;
            }
            .register-card {
                margin-top: 60px;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="auth-toggles">
        <button id="theme-toggle" class="btn btn-outline-ranch p-2 rounded-circle" title="Toggle Theme">
            <i class="bi bi-moon-stars"></i>
        </button>
        <button id="rtl-toggle" class="btn btn-outline-ranch p-2 rounded-circle" title="Toggle RTL">
            <i class="bi bi-arrow-left-right"></i>
        </button>
    </div>

    <div class="register-card">
        <a href="index.html" class="nav-logo-link">
            <div class="nav-logo justify-content-center mb-4">
                <i class="bi bi-compass"></i>
                <span class="fs-3">WildWest Ranch</span>
            </div>
        </a>
        <h2 class="western-font text-center mb-4">Join the Heritage</h2>
        
        <form>
            <div class="mb-3">
                <label class="form-label small fw-bold">First Name</label>
                <input type="text" class="form-control rounded-3 py-2" placeholder="Your first name" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Last Name</label>
                <input type="text" class="form-control rounded-3 py-2" placeholder="Your last name" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Email Address</label>
                <input type="email" class="form-control rounded-3 py-2" placeholder="email@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Password</label>
                <div class="password-field">
                    <input type="password" class="form-control rounded-3 py-2 pe-5" id="reg-password" placeholder="Create password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('reg-password')">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Confirm Password</label>
                <div class="password-field">
                    <input type="password" class="form-control rounded-3 py-2 pe-5" id="reg-confirm" placeholder="Repeat password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('reg-confirm')">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            
            <div class="form-check small text-muted my-4">
                <input class="form-check-input" type="checkbox" required id="consent">
                <label class="form-check-label" for="consent">
                    I agree to the <a href="liability-form.html" class="text-saddle-brown">Terms & Conditions</a>.
                </label>
            </div>

            <button type="submit" class="btn-ranch btn-primary-ranch w-100 py-3 mb-4 text-center d-flex align-items-center justify-content-center">Create Account</button>
        </form>

        <div class="mb-4">
            <div class="d-flex align-items-center gap-3 mb-3">
                <hr class="flex-grow-1 opacity-25">
                <span class="small text-muted">Or continue with</span>
                <hr class="flex-grow-1 opacity-25">
            </div>
            <div class="d-flex gap-3 justify-content-center">
                <button class="social-btn apple-btn" title="Login with Apple">
                    <i class="bi bi-apple"></i>
                </button>
                <button class="social-btn google-btn" title="Login with Google">
                    <i class="bi bi-google"></i>
                </button>
            </div>
        </div>
        
        <p class="small text-center text-muted mb-0">Already have an account? <a href="login.html" class="text-saddle-brown fw-bold">Login Here</a></p>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            const icon = input.nextElementSibling.querySelector('i');
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = "password";
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }
    </script>
</body>
</html>
