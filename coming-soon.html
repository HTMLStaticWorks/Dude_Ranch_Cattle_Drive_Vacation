<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saddling Up | Coming Soon</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1518467166778-b88f373ffec7?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            text-align: center;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="nav-logo justify-content-center mb-5">
            <i class="bi bi-compass text-white"></i>
            <span class="fs-2 text-white">WildWest Ranch</span>
        </div>
        <h1 class="western-font display-3 mb-4">Saddling Up</h1>
        <p class="lead mb-5 mx-auto" style="max-width: 600px;">We're currently preparing a new wilderness experience for you. Sign up to be the first to know when we open the gates.</p>
        
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="input-group mb-3">
                    <input type="email" class="form-control rounded-start-pill py-3 px-4 bg-transparent text-white border-white" placeholder="Enter your email">
                    <button class="btn btn-light rounded-end-pill px-5 fw-bold text-saddle-brown" type="button">Notify Me</button>
                </div>
            </div>
        </div>
        
        <div class="mt-5 d-flex justify-content-center gap-4">
            <a href="#" class="text-white fs-4"><i class="bi bi-instagram"></i></a>
            <a href="#" class="text-white fs-4"><i class="bi bi-facebook"></i></a>
            <a href="#" class="text-white fs-4"><i class="bi bi-youtube"></i></a>
        </div>
    </div>

</body>
</html>
